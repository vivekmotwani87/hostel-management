services:
  # Backend API Web Service
  - type: web
    name: hostel-management-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard with your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CLIENT_URL
        sync: false # Set to frontend URL once created

  # Frontend Static Site
  - type: web
    name: hostel-management-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hostel-management-backend
          envVarKey: RENDER_EXTERNAL_URL
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: hostel-management-backend
          envVarKey: RENDER_EXTERNAL_URL
          property: host
