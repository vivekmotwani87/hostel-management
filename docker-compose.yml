services:
  backend:
    build:
      context: ./backend
    container_name: hostel-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "5001"
      NODE_ENV: production
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
    container_name: hostel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
